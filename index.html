<!DOCTYPE html>
<html lang="es">
<head>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:wght@600&family=Cinzel:wght@600&family=Unbounded:wght@600&family=Marcellus&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lullaby for Erik — Evgeny Grinko</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    height: 100dvh;
    font-family: 'Cinzel', sans-serif;
    color: #fff;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .bg {
    position: fixed;
    inset: 0;
    background-image: url('fondo.jpg');
    background-size: cover;
    background-position: center;
    z-index: -2;
  }
  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.45);
  }
  .container {
    height: 100%;
    height: 100dvh;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(20px, env(safe-area-inset-bottom));
  }
  h1 {
    font-size: clamp(22px, 5vw, 34px);
    margin: 0 0 6px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.7);
  }
  p.subtitle {
    color: #ddd;
    margin: 0 0 40px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.7);
  }
  #embed-wrap {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 10px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    transform: translateY(100%);
    transition: transform .35s ease;
  }
  #embed-wrap.visible { transform: translateY(0); }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="container">
    <h1>LULLABY FOR ERIK</h1>
    <p class="subtitle">Evgeny Grinko</p>
    <p>Para María, Papá y Mamá</p>
  </div>
  <div id="embed-wrap">
    <iframe id="sc-widget"
      width="100%" height="80" scrolling="no" frameborder="no"
      allow="autoplay"
      src="https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fevgeny-grinko%2Flullaby-for-erik&color=%231db954&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false&visual=false">
    </iframe>
  </div>
<script src="https://w.soundcloud.com/player/api.js"></script>
<script>

  const TRACK_URL = 'https://soundcloud.com/evgeny-grinko/lullaby-for-erik';
  const START_SECONDS = 0; // pon aquí el segundo de inicio (p. ej. 80 = 1:20)
  const START_MS = START_SECONDS * 1000;

  const iframeEl = document.getElementById('sc-widget');
  const widget = SC.Widget(iframeEl);

  let widgetReady = false;
  let seeked = false;

  widget.bind(SC.Widget.Events.READY, () => {
    widgetReady = true;
    widget.play();
  });

  widget.bind(SC.Widget.Events.PLAY, () => {
    document.getElementById('embed-wrap').classList.add('visible');
    if (!seeked) {
      seeked = true;
      if (START_SECONDS > 0) widget.seekTo(START_MS);
    }
  });
 
  setTimeout(() => {
    if (!widgetReady) window.open(TRACK_URL, '_blank');
  }, 5000);
</script>
</body>
</html>
